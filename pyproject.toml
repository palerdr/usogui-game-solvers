[project]
name = "stl"
version = "0.1.0"
description = "Surpassing The Leader: the exact DTH and leap solvers, Hal, and the browser game."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "highspy>=1.12,<2",
    "httpx>=0.28.1",
    "llvmlite>=0.49,<0.50",
    "numba>=0.67.0,<0.68",
    "numpy>=2.0,<3",
    "pydantic>=2.13,<3",
    "scipy>=1.14,<2",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-xdist>=3.6",
    "ruff==0.17.2",
]


[tool.ruff]
extend-exclude = ["src/stl/leap_kernel.py"]
force-exclude = true
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest]
testpaths = ["tests"]
markers = ["slow: a full-domain leap check against the real tables"]
[tool.pyright]
include = ["src/stl", "tests"]
typeCheckingMode = "standard"
ignore = ["src/stl/leap_kernel.py"]
