[project]
name = "stl"
version = "0.1.0"
description = "Surpassing The Leader: the exact DTH and leap solvers, Hal, and the browser game."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.141.1",
    "highspy>=1.12,<2",
    "httpx>=0.28.1",
    "llvmlite>=0.49,<0.50",
    "numba>=0.67.0,<0.68",
    "numpy>=2.0,<3",
    "pydantic>=2.13,<3",
    "scipy>=1.14,<2",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[tool.pytest]
testpaths = ["tests"]
# The suite is overwhelmingly independent and every artifact-building test
# already writes under its own tmp_path, so it distributes cleanly. Use "-n 0"
# when a failure needs a readable serial traceback.
# CI passes "-n logical" to use every runner core.
addopts = ["-n", "8"]
# Slow tests run by default. Use -m "not slow" for a tighter loop.
markers = ["slow: a full-domain leap check against the real tables"]
