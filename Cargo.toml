[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
highs = "2.4"
memmap2 = "0.9"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
stl-dth = { path = "crates/stl-dth" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

[profile.test]
opt-level = 3
